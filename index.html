<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090c13">
<title>AI Workspace</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <div class="brand-mark">✦</div>
            <div><div class="brand-title">AI Workspace</div><div class="brand-subtitle">Personal AI Assistant</div></div>
        </div>
        <button class="icon-btn mobile-close" id="closeSidebar">×</button>
    </div>
    <button class="new-chat-btn" id="newChatBtn"><span>＋</span> New chat</button>
    <div class="history">
        <div class="history-label">RECENT CHATS</div>
        <div id="chatHistory"></div>
    </div>
    <div class="sidebar-footer"><div class="status-dot"></div><span>AI services connected</span></div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="main">
    <header class="topbar">
        <button class="icon-btn menu-btn" id="openSidebar">☰</button>
        <div class="topbar-title"><strong id="chatTitle">New chat</strong><span id="providerStatus">Ready</span></div>
    </header>

    <section class="chat-scroll" id="chatScroll">
        <div class="chat-container" id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-mark">✦</div>
                <h1>How can I help you?</h1>
                <p>Ask anything. Write, analyze, explain, code, brainstorm, or solve a problem.</p>
                <div class="suggestions">
                    <button class="suggestion" data-prompt="Explain how an API works in simple terms."><span>⌁</span>Explain an API simply</button>
                    <button class="suggestion" data-prompt="Help me create a professional business plan outline."><span>▤</span>Create a business plan</button>
                    <button class="suggestion" data-prompt="Review this idea and tell me how I can improve it."><span>◇</span>Improve an idea</button>
                    <button class="suggestion" data-prompt="Write a Python example that calls a REST API."><span>&lt;/&gt;</span>Write some code</button>
                </div>
            </div>
        </div>
    </section>

    <div class="composer-wrap">
        <div class="composer">
            <textarea id="prompt" rows="1" placeholder="Message AI Workspace..." autocomplete="off"></textarea>
            <button id="sendBtn" class="send-btn" aria-label="Send message" disabled><span>↑</span></button>
        </div>
        <div class="composer-hint">Enter to send · Shift + Enter for a new line</div>
    </div>
</main>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
                                                                            </html>
