<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="color-scheme" content="dark">
<title>AI Workspace</title>
<style>
:root{
  --bg:#090b10;
  --surface:#0e1118;
  --surface-2:#121722;
  --surface-3:#171d29;
  --border:#242c3a;
  --text:#f2f5f9;
  --muted:#8792a3;
  --muted-2:#606b7c;
  --accent:#8067ff;
  --accent-2:#5d8dff;
  --success:#43d38b;
  --danger:#ff6d78;
  --sidebar:270px;
  --composer:820px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,textarea{font:inherit}
button{color:inherit}
.app{
  width:100%;
  height:100dvh;
  display:flex;
  background:
    radial-gradient(900px 500px at 55% -15%,rgba(103,79,220,.14),transparent 65%),
    var(--bg);
}
.sidebar{
  width:var(--sidebar);
  min-width:var(--sidebar);
  height:100%;
  display:flex;
  flex-direction:column;
  background:rgba(12,15,22,.98);
  border-right:1px solid var(--border);
  z-index:50;
}
.brand{
  height:72px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 18px;
}
.brand-icon,.hero-icon,.avatar.ai{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
}
.brand-icon{
  width:36px;height:36px;border-radius:11px;
  display:grid;place-items:center;
  box-shadow:0 8px 28px rgba(103,83,245,.28);
  font-size:18px;font-weight:700;
}
.brand-name{font-size:14px;font-weight:750}
.brand-sub{font-size:10px;color:var(--muted);margin-top:2px}
.new-chat{
  margin:8px 13px 20px;height:43px;
  border:1px solid var(--border);
  border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;gap:9px;
  padding:0 13px;cursor:pointer;
  font-size:13px;font-weight:600;
}
.new-chat:hover{background:var(--surface-3)}
.new-chat-icon{font-size:19px;color:#b9adff}
.history{flex:1;min-height:0;overflow-y:auto;padding:0 9px}
.history-title{
  padding:0 9px 9px;color:var(--muted-2);
  font-size:9px;font-weight:800;letter-spacing:.13em;
}
.history-empty{color:#566173;font-size:11px;line-height:1.5;padding:10px 9px}
.chat-row{
  width:100%;min-height:39px;
  display:flex;align-items:center;
  border:0;border-radius:8px;background:transparent;
  padding:0 10px;margin:2px 0;color:#aeb8c8;
  text-align:left;cursor:pointer;font-size:12px;
}
.chat-row:hover,.chat-row.active{background:#151b26;color:var(--text)}
.chat-row-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{
  border-top:1px solid #1b2230;
  padding:15px 17px;display:flex;align-items:center;gap:8px;
  color:var(--muted-2);font-size:10px;
}
.status-light,.badge-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--success);box-shadow:0 0 10px rgba(67,211,139,.65);
}
.main{
  min-width:0;flex:1;height:100%;
  position:relative;display:flex;flex-direction:column;
}
.topbar{
  height:64px;min-height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;border-bottom:1px solid rgba(36,44,58,.72);
  background:rgba(9,11,16,.80);backdrop-filter:blur(16px);z-index:10;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.mobile-menu{
  display:none;width:35px;height:35px;
  border:1px solid var(--border);border-radius:9px;
  background:var(--surface-2);cursor:pointer;font-size:16px;
}
.chat-name{
  font-size:13px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:360px;
}
.chat-state{font-size:10px;color:var(--muted);margin-top:3px}
.topbar-badge{
  display:flex;align-items:center;gap:7px;
  padding:7px 10px;border:1px solid var(--border);
  border-radius:999px;color:var(--muted);
  background:rgba(16,20,29,.75);font-size:10px;
}
.chat-area{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{
  width:100%;max-width:900px;min-height:100%;
  margin:0 auto;padding:40px 25px 180px;
}
.welcome{
  min-height:calc(100dvh - 245px);
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:20px 0 80px;
}
.hero-icon{
  width:64px;height:64px;display:grid;place-items:center;
  border-radius:19px;box-shadow:0 15px 45px rgba(99,82,235,.25);
  font-size:29px;margin-bottom:22px;
}
.welcome h1{
  margin:0;font-size:clamp(30px,4vw,42px);
  line-height:1.1;letter-spacing:-.035em;font-weight:750;
}
.welcome p{
  max-width:570px;margin:12px 0 0;color:var(--muted);
  font-size:13px;line-height:1.7;
}
.quick-grid{
  width:100%;max-width:690px;
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-top:30px;
}
.quick{
  min-height:60px;border:1px solid var(--border);
  border-radius:12px;background:rgba(17,22,31,.78);
  text-align:left;padding:11px 13px;cursor:pointer;color:#bac4d2;
}
.quick:hover{background:#171e2a;border-color:#374256}
.quick-icon{display:inline-grid;place-items:center;width:24px;margin-right:4px;color:#aa9cff}
.quick-title{font-size:12px;font-weight:650}
.message{
  display:flex;align-items:flex-start;gap:12px;
  margin:0 0 29px;animation:messageIn .18s ease-out;
}
@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.avatar{
  width:32px;height:32px;min-width:32px;border-radius:9px;
  display:grid;place-items:center;margin-top:2px;
  font-size:9px;font-weight:800;
}
.avatar.user{background:#273245;color:#dbe3ed}
.message-content{
  min-width:0;flex:1;font-size:14px;line-height:1.75;color:#dce3ec;
}
.message.user .message-content{
  flex:0 1 auto;max-width:82%;padding:11px 14px;
  border:1px solid #253145;border-radius:5px 13px 13px 13px;
  background:#17202e;white-space:pre-wrap;
}
.message.ai .message-content{padding:1px 0}
.message-content p{margin:0 0 12px}
.message-content p:last-child{margin-bottom:0}
.message-content h2,.message-content h3{color:#fff;line-height:1.3;margin:18px 0 8px}
.message-content h2{font-size:18px}.message-content h3{font-size:15px}
.inline-code{
  background:#181f2a;border:1px solid #252e3c;border-radius:5px;
  padding:1px 5px;color:#ddd6ff;font:12px Consolas,Monaco,monospace;
}
.code-block{
  margin:13px 0;border:1px solid #293345;border-radius:10px;
  overflow:hidden;background:#080b10;
}
.code-top{
  height:32px;display:flex;align-items:center;justify-content:space-between;
  padding:0 9px 0 12px;border-bottom:1px solid #222c3b;
  background:#0e131b;color:#687486;font-size:9px;
}
.copy{border:0;background:transparent;color:#8792a2;cursor:pointer;font-size:10px}
pre{margin:0;padding:14px;overflow-x:auto;color:#d8deea;font:12px/1.6 Consolas,Monaco,"Courier New",monospace}
.typing{height:28px;display:flex;align-items:center;gap:5px}
.typing i{
  width:6px;height:6px;border-radius:50%;background:#7f8b9d;
  animation:dot 1.15s infinite ease-in-out;
}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.composer-zone{
  position:absolute;left:0;right:0;bottom:0;
  padding:25px 20px 17px;
  background:linear-gradient(to bottom,transparent 0%,rgba(9,11,16,.9) 30%,var(--bg) 55%);
  z-index:8;
}
.composer{
  max-width:var(--composer);margin:0 auto;
  display:flex;align-items:flex-end;gap:8px;
  padding:9px 9px 9px 15px;
  border:1px solid #2b3546;border-radius:15px;
  background:#111620;box-shadow:0 20px 70px rgba(0,0,0,.45);
}
.composer:focus-within{border-color:#4b4b71}
#prompt{
  flex:1;min-width:0;max-height:180px;min-height:38px;
  resize:none;border:0;outline:0;background:transparent;
  color:var(--text);padding:8px 0;font-size:14px;line-height:1.5;
}
#prompt::placeholder{color:#687486}
.send{
  width:39px;height:39px;min-width:39px;border:0;border-radius:10px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:white;cursor:pointer;font-size:20px;
}
.send:disabled{opacity:.3;cursor:not-allowed}
.composer-note{
  max-width:var(--composer);margin:7px auto 0;
  text-align:center;color:#586375;font-size:9px;
}
.overlay{display:none}
@media(max-width:760px){
  .sidebar{
    position:fixed;left:-285px;top:0;bottom:0;
    transition:left .22s ease;box-shadow:25px 0 60px rgba(0,0,0,.5);
  }
  .sidebar.open{left:0}
  .overlay{
    position:fixed;inset:0;z-index:40;
    background:rgba(0,0,0,.58);backdrop-filter:blur(2px);
  }
  .overlay.open{display:block}
  .mobile-menu{display:grid;place-items:center}
  .topbar{padding:0 14px}
  .topbar-badge{display:none}
  .chat-inner{padding:28px 14px 155px}
  .welcome{min-height:calc(100dvh - 230px);padding:0 0 55px}
  .welcome h1{font-size:31px}
  .welcome p{font-size:12px}
  .quick-grid{grid-template-columns:1fr;gap:8px;margin-top:24px}
  .quick{min-height:53px}
  .message{gap:9px;margin-bottom:24px}
  .message.user .message-content{max-width:91%}
  .message-content{font-size:13px}
  .composer-zone{padding:15px 10px 11px}
  .composer{border-radius:13px;padding-left:12px}
  .composer-note{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">✦</div>
      <div>
        <div class="brand-name">AI Workspace</div>
        <div class="brand-sub">Personal AI Assistant</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      <span class="new-chat-icon">＋</span>
      <span>New chat</span>
    </button>

    <div class="history">
      <div class="history-title">RECENT CHATS</div>
      <div id="historyList"></div>
    </div>

    <div class="sidebar-bottom">
      <span class="status-light"></span>
      <span>AI services connected</span>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div>
          <div class="chat-name" id="chatName">New chat</div>
          <div class="chat-state" id="chatState">Ready</div>
        </div>
      </div>

      <div class="topbar-badge">
        <span class="badge-dot"></span>
        <span id="serviceBadge">Backend AI</span>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <div class="hero-icon">✦</div>
          <h1>How can I help you?</h1>
          <p>Ask anything. Write, analyze, explain, code, brainstorm, summarize, or solve a problem.</p>

          <div class="quick-grid">
            <button class="quick" data-prompt="Explain how an API works in simple terms.">
              <span class="quick-icon">⌁</span><span class="quick-title">Explain an API simply</span>
            </button>
            <button class="quick" data-prompt="Help me create a professional business plan outline.">
              <span class="quick-icon">▤</span><span class="quick-title">Create a business plan</span>
            </button>
            <button class="quick" data-prompt="Review this idea and tell me how I can improve it.">
              <span class="quick-icon">◇</span><span class="quick-title">Improve an idea</span>
            </button>
            <button class="quick" data-prompt="Write a Python example that calls a REST API.">
              <span class="quick-icon">&lt;/&gt;</span><span class="quick-title">Write some code</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="composer-zone">
      <div class="composer">
        <textarea id="prompt" rows="1" maxlength="20000" placeholder="Message AI Workspace..." aria-label="Message AI Workspace"></textarea>
        <button class="send" id="send" disabled aria-label="Send message">↑</button>
      </div>
      <div class="composer-note">Enter to send · Shift + Enter for a new line</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const sidebar = $("sidebar");
  const overlay = $("overlay");
  const mobileMenu = $("mobileMenu");
  const newChat = $("newChat");
  const historyList = $("historyList");
  const chatName = $("chatName");
  const chatState = $("chatState");
  const serviceBadge = $("serviceBadge");
  const chatArea = $("chatArea");
  const chatInner = $("chatInner");
  const prompt = $("prompt");
  const send = $("send");

  const STORAGE_KEY = "ai_workspace_chats_v2";
  let messages = [];
  let busy = false;
  let currentChatId = createId();
  let savedChats = loadChats();

  function createId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
  }

  function loadChats(){
    try{
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(value) ? value : [];
    }catch{
      return [];
    }
  }

  function persistChats(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(savedChats)); }catch{}
  }

  function escapeHtml(value){
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
  }

  function renderMarkdown(source){
    let text = escapeHtml(source);
    const blocks = [];

    text = text.replace(/```([a-zA-Z0-9_+#.-]*)\n?([\s\S]*?)```/g, (_,lang,code) => {
      const i = blocks.length;
      blocks.push({lang:lang || "code", code:code.trim()});
      return "@@CODE_" + i + "@@";
    });

    text = text
      .replace(/`([^`\n]+)`/g,'<span class="inline-code">$1</span>')
      .replace(/^### (.+)$/gm,"<h3>$1</h3>")
      .replace(/^## (.+)$/gm,"<h2>$1</h2>")
      .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
      .replace(/^[-*] (.+)$/gm,"• $1")
      .replace(/\n{2,}/g,"</p><p>")
      .replace(/\n/g,"<br>");

    text = "<p>" + text + "</p>";

    blocks.forEach((block,i) => {
      const html =
        '<div class="code-block">' +
          '<div class="code-top">' +
            '<span>' + escapeHtml(block.lang) + '</span>' +
            '<button class="copy" data-copy="' + encodeURIComponent(block.code) + '">Copy</button>' +
          '</div>' +
          '<pre><code>' + escapeHtml(block.code) + '</code></pre>' +
        '</div>';
      text = text.replace("@@CODE_" + i + "@@", html);
    });

    return text;
  }

  function scrollBottom(){
    requestAnimationFrame(() => chatArea.scrollTop = chatArea.scrollHeight);
  }

  function setState(text){ chatState.textContent = text; }

  function setBusy(value){
    busy = value;
    prompt.disabled = value;
    send.disabled = value || !prompt.value.trim();
    setState(value ? "Thinking…" : "Ready");
  }

  function updateSend(){
    send.disabled = busy || !prompt.value.trim();
  }

  function autoResize(){
    prompt.style.height = "auto";
    prompt.style.height = Math.min(prompt.scrollHeight,180) + "px";
  }

  function clearWelcome(){
    const welcome = $("welcome");
    if(welcome) welcome.remove();
  }

  function addMessage(role, content){
    clearWelcome();

    const row = document.createElement("div");
    row.className = "message " + (role === "user" ? "user" : "ai");

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (role === "user" ? "user" : "ai");
    avatar.textContent = role === "user" ? "YOU" : "✦";

    const body = document.createElement("div");
    body.className = "message-content";

    if(role === "user"){
      body.textContent = content;
    }else{
      body.innerHTML = renderMarkdown(content);
    }

    row.appendChild(avatar);
    row.appendChild(body);
    chatInner.appendChild(row);

    row.querySelectorAll(".copy").forEach(button => {
      button.addEventListener("click", async () => {
        try{
          await navigator.clipboard.writeText(decodeURIComponent(button.dataset.copy || ""));
          button.textContent = "Copied";
          setTimeout(() => button.textContent = "Copy", 1200);
        }catch{
          button.textContent = "Failed";
          setTimeout(() => button.textContent = "Copy", 1200);
        }
      });
    });

    scrollBottom();
  }

  function showTyping(){
    clearWelcome();
    const row = document.createElement("div");
    row.className = "message ai";
    row.id = "typingMessage";
    row.innerHTML =
      '<div class="avatar ai">✦</div>' +
      '<div class="message-content"><div class="typing"><i></i><i></i><i></i></div></div>';
    chatInner.appendChild(row);
    scrollBottom();
  }

  function hideTyping(){
    $("typingMessage")?.remove();
  }

  function bindQuick(){
    document.querySelectorAll(".quick").forEach(button => {
      button.addEventListener("click", () => {
        prompt.value = button.dataset.prompt || "";
        autoResize();
        updateSend();
        prompt.focus();
      });
    });
  }

  function resetInterface(){
    messages = [];
    chatInner.innerHTML =
      '<div class="welcome" id="welcome">' +
        '<div class="hero-icon">✦</div>' +
        '<h1>How can I help you?</h1>' +
        '<p>Ask anything. Write, analyze, explain, code, brainstorm, summarize, or solve a problem.</p>' +
        '<div class="quick-grid">' +
          '<button class="quick" data-prompt="Explain how an API works in simple terms."><span class="quick-icon">⌁</span><span class="quick-title">Explain an API simply</span></button>' +
          '<button class="quick" data-prompt="Help me create a professional business plan outline."><span class="quick-icon">▤</span><span class="quick-title">Create a business plan</span></button>' +
          '<button class="quick" data-prompt="Review this idea and tell me how I can improve it."><span class="quick-icon">◇</span><span class="quick-title">Improve an idea</span></button>' +
          '<button class="quick" data-prompt="Write a Python example that calls a REST API."><span class="quick-icon">&lt;/&gt;</span><span class="quick-title">Write some code</span></button>' +
        '</div>' +
      '</div>';

    bindQuick();
    chatName.textContent = "New chat";
    serviceBadge.textContent = "Backend AI";
    setState("Ready");
    prompt.value = "";
    prompt.style.height = "auto";
    updateSend();
    closeSidebar();
    prompt.focus();
  }

  function saveCurrentChat(){
    if(!messages.length) return;

    const firstUser = messages.find(m => m.role === "user");
    if(!firstUser) return;

    const title = firstUser.content.replace(/\s+/g," ").trim().slice(0,50) || "New chat";
    const existing = savedChats.find(c => c.id === currentChatId);

    if(existing){
      existing.title = title;
      existing.messages = messages;
      existing.updatedAt = Date.now();
    }else{
      savedChats.unshift({
        id: currentChatId,
        title,
        messages,
        updatedAt: Date.now()
      });
    }

    savedChats.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    savedChats = savedChats.slice(0,30);
    persistChats();
    renderHistory();
    chatName.textContent = title;
  }

  function renderHistory(){
    historyList.innerHTML = "";

    if(!savedChats.length){
      const empty = document.createElement("div");
      empty.className = "history-empty";
      empty.textContent = "Your conversations will appear here.";
      historyList.appendChild(empty);
      return;
    }

    savedChats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "chat-row" + (chat.id === currentChatId ? " active" : "");

      const span = document.createElement("span");
      span.className = "chat-row-text";
      span.textContent = chat.title || "Untitled chat";

      button.appendChild(span);
      button.addEventListener("click", () => loadChat(chat.id));
      historyList.appendChild(button);
    });
  }

  function loadChat(id){
    const chat = savedChats.find(c => c.id === id);
    if(!chat) return;

    currentChatId = id;
    messages = Array.isArray(chat.messages) ? chat.messages.slice() : [];

    chatInner.innerHTML = "";
    messages.forEach(message => addMessage(message.role,message.content));

    chatName.textContent = chat.title || "Chat";
    serviceBadge.textContent = "Backend AI";
    setState("Ready");
    renderHistory();
    closeSidebar();
    prompt.focus();
  }

  async function sendMessage(){
    if(busy) return;

    const text = prompt.value.trim();
    if(!text) return;

    prompt.value = "";
    prompt.style.height = "auto";

    messages.push({role:"user",content:text});
    addMessage("user",text);

    setBusy(true);
    showTyping();

    try{
      const response = await fetch("/api/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages})
      });

      let data;
      try{
        data = await response.json();
      }catch{
        throw new Error("The server returned invalid JSON. HTTP " + response.status + ".");
      }

      if(!response.ok || !data.ok){
        throw new Error(data.error || "The AI backend could not complete the request.");
      }

      const answer = String(data.text || "").trim();
      if(!answer){
        throw new Error("The AI returned an empty response.");
      }

      hideTyping();

      messages.push({role:"assistant",content:answer});
      addMessage("assistant",answer);

      serviceBadge.textContent =
        (data.provider || "AI") + (data.model ? " · " + data.model : "");

      saveCurrentChat();

    }catch(error){
      hideTyping();
      addMessage(
        "assistant",
        "I couldn't complete that request.\n\n" +
        (error && error.message ? error.message : "Unknown backend error.")
      );
      setState("Request failed");
    }finally{
      setBusy(false);
      updateSend();
      prompt.focus();
    }
  }

  function openSidebar(){
    sidebar.classList.add("open");
    overlay.classList.add("open");
  }

  function closeSidebar(){
    sidebar.classList.remove("open");
    overlay.classList.remove("open");
  }

  prompt.addEventListener("input",() => {
    autoResize();
    updateSend();
  });

  prompt.addEventListener("keydown",event => {
    if(event.key === "Enter" && !event.shiftKey){
      event.preventDefault();
      sendMessage();
    }
  });

  send.addEventListener("click",sendMessage);

  newChat.addEventListener("click",() => {
    currentChatId = createId();
    resetInterface();
    renderHistory();
  });

  mobileMenu.addEventListener("click",openSidebar);
  overlay.addEventListener("click",closeSidebar);

  bindQuick();
  renderHistory();
  updateSend();

  fetch("/health")
    .then(r => {
      if(!r.ok) throw new Error();
      return r.json();
    })
    .then(data => {
      if(data.gemini_configured || data.groq_configured){
        serviceBadge.textContent = "Backend AI ready";
      }else{
        serviceBadge.textContent = "API key not configured";
      }
    })
    .catch(() => {
      serviceBadge.textContent = "Backend unavailable";
    });
})();
</script>
</body>
</html>
